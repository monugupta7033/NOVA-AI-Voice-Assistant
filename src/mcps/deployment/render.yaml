services:
  - type: web
    name: mcp-hub-server
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python src/mcps/run_hub.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_TEAM_ID
        sync: false
      - key: SLACK_CHANNEL_IDS
        sync: false
      - key: BRAVE_API_KEY
        sync: false
      - key: WOLFRAM_API_KEY
        sync: false 